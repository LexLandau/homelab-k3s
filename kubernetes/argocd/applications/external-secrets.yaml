# External Secrets Operator: holt Secrets aus 1Password (Tresor Homelab-K3s-ESO).
# Bewusst ohne resources-finalizer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      values: |
        # rpi4-cm4 meiden (RAM-Auslastung hoch)
        affinity: &avoidcm4
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: ["rpi4-cm4"]
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
        webhook:
          affinity: *avoidcm4
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
        certController:
          affinity: *avoidcm4
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true   # grosse CRDs
