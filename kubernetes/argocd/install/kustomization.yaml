# Argo CD Installation (Non-HA), offizielles Manifest in fester Version.
# Upgrade: Version unten aendern, vorher Upgrade-Hinweise lesen:
# https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/overview/
# Anpassungen nur als Kustomize-Patch hier, nie direkt im Cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
patches:
  # Dex (SSO) wird nicht genutzt (dex.config leer): abgeschaltet zur Entlastung der Knoten.
  # Rueckgaengig: diesen Patch entfernen.
  - target:
      kind: Deployment
      name: argocd-dex-server
    patch: |-
      - op: add
        path: /spec/replicas
        value: 0
  # Resource Requests und Limits nach Messung (p95/Max ueber 7 Tage).
  # Bewusst keine CPU-Limits (kein Drosseln), nur Speicher-Limits.
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                resources:
                  requests:
                    memory: 640Mi
                    cpu: 100m
                  limits:
                    memory: 1280Mi
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                resources:
                  requests:
                    memory: 192Mi
                    cpu: 50m
                  limits:
                    memory: 384Mi
  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-server
                resources:
                  requests:
                    memory: 64Mi
                    cpu: 25m
                  limits:
                    memory: 160Mi
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-applicationset-controller
                resources:
                  requests:
                    memory: 48Mi
                    cpu: 10m
                  limits:
                    memory: 128Mi
  - target:
      kind: Deployment
      name: argocd-notifications-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-notifications-controller
                resources:
                  requests:
                    memory: 48Mi
                    cpu: 10m
                  limits:
                    memory: 128Mi
  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests:
                    memory: 32Mi
                    cpu: 10m
                  limits:
                    memory: 64Mi
