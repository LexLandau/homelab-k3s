# Zugangsdaten fuer das Longhorn-Backup-Ziel (Samba LonghornBackup auf rpi5).
# Quelle: 1Password, Tresor Homelab-K3s-ESO, Eintrag samba-longhorn-backup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cifs-secret
  namespace: longhorn-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cifs-secret
    creationPolicy: Owner
  data:
  - secretKey: CIFS_USERNAME
    remoteRef:
      key: samba-longhorn-backup/username
  - secretKey: CIFS_PASSWORD
    remoteRef:
      key: samba-longhorn-backup/password
