# Zugriff auf 1Password-Tresor Homelab-K3s-ESO ueber Service Account eso-k3s (nur Lesen).
# Token liegt im manuell angelegten Secret external-secrets/onepassword-sa-token (nicht in Git).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  conditions:
  - namespaces: ["default", "monitoring", "longhorn-system"]
  provider:
    onepasswordSDK:
      vault: Homelab-K3s-ESO
      auth:
        serviceAccountSecretRef:
          name: onepassword-sa-token
          namespace: external-secrets
          key: token
