# Grafana-Adminzugang aus 1Password (Tresor Homelab-K3s-ESO, Eintrag grafana-admin).
# Hinweis: Grafana uebernimmt das Passwort nur beim ersten Start; danach gilt die Grafana-Datenbank.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
  - secretKey: admin-user
    remoteRef:
      key: grafana-admin/username
  - secretKey: admin-password
    remoteRef:
      key: grafana-admin/password
