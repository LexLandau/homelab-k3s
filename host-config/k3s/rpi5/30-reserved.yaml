# Speicherreservierung fuer Kubernetes und Betriebssystem, nur fuer rpi5.
# Ziel auf dem Knoten: /etc/rancher/k3s/config.yaml.d/30-reserved.yaml
# Werte nach Messung des Eigenverbrauchs (k3s, etcd, containerd und System).
# Allocatable = Kapazitaet - kube-reserved - system-reserved (k3s setzt keine RAM-Eviction-Schwelle).
# "kubelet-arg+" haengt an eine eventuell vorhandene Liste an.
kubelet-arg+:
  - "kube-reserved=memory=1536Mi"
  - "system-reserved=memory=256Mi"
